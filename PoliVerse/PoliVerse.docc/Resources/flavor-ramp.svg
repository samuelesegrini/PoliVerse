<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="398" viewBox="0 0 1000 398" role="img" aria-labelledby="t"><title id="t">Accent and Extra derived from Main, and the ramp a page hands out its colours from.</title><style>text{font-family:-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Helvetica Neue', Arial, sans-serif} .m{font-family:ui-monospace, SFMono-Regular, Menlo, monospace}</style><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6C6C70"/></marker></defs><defs><marker id="acc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0F3D6E"/></marker></defs><text x="24" y="34" font-size="15" font-weight="700" fill="#0F3D6E" text-anchor="start" opacity="1">One colour becomes the palette</text><text x="24" y="54" font-size="11.5" font-weight="400" fill="#6C6C70" text-anchor="start" opacity="1">Flavor.derived(hueShift:saturation:brightness:), from the Politecnico's own navy</text><rect x="24" y="74" width="222" height="116" rx="12" fill="#F7F7FA" stroke="#D6D6DB" stroke-width="1"/><rect x="38" y="88" width="70" height="70" rx="16" fill="#0F3D6E"/><text x="122" y="108" font-size="14" font-weight="700" fill="#1C1C1E" text-anchor="start" opacity="1">Main</text><text x="122" y="126" font-size="11.5" font-weight="600" fill="#6C6C70" text-anchor="start" opacity="1" class="m">#0F3D6E</text><text x="38" y="178" font-size="10" font-weight="500" fill="#6C6C70" text-anchor="start" opacity="1" class="m">the colour the student picked</text><rect x="270" y="74" width="222" height="116" rx="12" fill="#F7F7FA" stroke="#D6D6DB" stroke-width="1"/><rect x="284" y="88" width="70" height="70" rx="16" fill="#155B5E"/><text x="368" y="108" font-size="14" font-weight="700" fill="#1C1C1E" text-anchor="start" opacity="1">Accent</text><text x="368" y="126" font-size="11.5" font-weight="600" fill="#6C6C70" text-anchor="start" opacity="1" class="m">#155B5E</text><text x="284" y="178" font-size="10" font-weight="500" fill="#6C6C70" text-anchor="start" opacity="1" class="m">hue −0.08 · sat ×0.90 · bri ×0.85</text><text x="368" y="146" font-size="10.5" font-weight="400" fill="#6C6C70" text-anchor="start" opacity="1">controls and marks</text><path d="M248,124 L264,124" stroke="#0F3D6E" stroke-width="1.6" fill="none" marker-end="url(#acc)"/><rect x="516" y="74" width="222" height="116" rx="12" fill="#F7F7FA" stroke="#D6D6DB" stroke-width="1"/><rect x="530" y="88" width="70" height="70" rx="16" fill="#0E4D29"/><text x="614" y="108" font-size="14" font-weight="700" fill="#1C1C1E" text-anchor="start" opacity="1">Extra</text><text x="614" y="126" font-size="11.5" font-weight="600" fill="#6C6C70" text-anchor="start" opacity="1" class="m">#0E4D29</text><text x="530" y="178" font-size="10" font-weight="500" fill="#6C6C70" text-anchor="start" opacity="1" class="m">hue −0.18 · sat ×0.95 · bri ×0.70</text><text x="614" y="146" font-size="10.5" font-weight="400" fill="#6C6C70" text-anchor="start" opacity="1">a further, darker step</text><path d="M494,124 L510,124" stroke="#0F3D6E" stroke-width="1.6" fill="none" marker-end="url(#acc)"/><rect x="762" y="74" width="214" height="116" rx="12" fill="#EFEFF4" stroke="#C25E10" stroke-width="1.6" stroke-dasharray="6 5"/><text x="778" y="100" font-size="12.5" font-weight="700" fill="#C25E10" text-anchor="start" opacity="1">A grey only deepens</text><text x="778" y="122" font-size="10.5" font-weight="400" fill="#1C1C1E" text-anchor="start" opacity="1">Under 0.12 saturation there is</text><text x="778" y="138" font-size="10.5" font-weight="400" fill="#1C1C1E" text-anchor="start" opacity="1">no hue worth moving along, and</text><text x="778" y="154" font-size="10.5" font-weight="400" fill="#1C1C1E" text-anchor="start" opacity="1">spreading one would invent a</text><text x="778" y="170" font-size="10.5" font-weight="400" fill="#1C1C1E" text-anchor="start" opacity="1">colour nobody picked.</text><text x="24" y="232" font-size="14" font-weight="700" fill="#0F3D6E" text-anchor="start" opacity="1">FlavorRamp — deep to pale across a sixth of the wheel</text><text x="24" y="251" font-size="11.5" font-weight="400" fill="#6C6C70" text-anchor="start" opacity="1">A page hands out steps by position, so a settings page's tiles and a course's marks stay in the look's own family.</text><rect x="24" y="266" width="111" height="54" rx="10" fill="#11777A"/><text x="79" y="338" font-size="10" font-weight="600" fill="#6C6C70" text-anchor="middle" opacity="1" class="m">#11777A</text><rect x="143" y="266" width="111" height="54" rx="10" fill="#13758A"/><text x="198" y="338" font-size="10" font-weight="600" fill="#6C6C70" text-anchor="middle" opacity="1" class="m">#13758A</text><rect x="262" y="266" width="111" height="54" rx="10" fill="#157099"/><text x="317" y="338" font-size="10" font-weight="600" fill="#6C6C70" text-anchor="middle" opacity="1" class="m">#157099</text><rect x="381" y="266" width="111" height="54" rx="10" fill="#1767A8"/><text x="436" y="338" font-size="10" font-weight="600" fill="#6C6C70" text-anchor="middle" opacity="1" class="m">#1767A8</text><rect x="500" y="266" width="111" height="54" rx="10" fill="#195BB8"/><text x="555" y="338" font-size="10" font-weight="600" fill="#6C6C70" text-anchor="middle" opacity="1" class="m">#195BB8</text><rect x="619" y="266" width="111" height="54" rx="10" fill="#1B4BC7"/><text x="674" y="338" font-size="10" font-weight="600" fill="#6C6C70" text-anchor="middle" opacity="1" class="m">#1B4BC7</text><rect x="738" y="266" width="111" height="54" rx="10" fill="#1D37D6"/><text x="793" y="338" font-size="10" font-weight="600" fill="#6C6C70" text-anchor="middle" opacity="1" class="m">#1D37D6</text><rect x="857" y="266" width="111" height="54" rx="10" fill="#1F20E5"/><text x="912" y="338" font-size="10" font-weight="600" fill="#6C6C70" text-anchor="middle" opacity="1" class="m">#1F20E5</text><text x="24" y="358" font-size="10.5" font-weight="600" fill="#6C6C70" text-anchor="start" opacity="1">0 — deepest</text><text x="976" y="358" font-size="10.5" font-weight="600" fill="#6C6C70" text-anchor="end" opacity="1">1 — palest</text><text x="24" y="382" font-size="11" font-weight="500" fill="#6C6C70" text-anchor="start" opacity="1">Each step is then nudged until it clears the page it is drawn on, so a dark look never draws near-black on near-black.</text></svg>