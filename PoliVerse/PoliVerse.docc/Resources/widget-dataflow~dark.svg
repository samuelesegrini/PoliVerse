<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="340" viewBox="0 0 1000 340" role="img" aria-labelledby="t"><title id="t">The app writes snapshots into the app-group OfflineStore; the widgets and the Live Activity only read from it.</title><style>text{font-family:-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Helvetica Neue', Arial, sans-serif} .m{font-family:ui-monospace, SFMono-Regular, Menlo, monospace}</style><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9A9AA0"/></marker></defs><defs><marker id="acc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6BA8DE"/></marker></defs><defs><marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4CD964"/></marker></defs><rect x="24" y="40" width="300" height="150" rx="12" fill="#2A2A2E" stroke="#6BA8DE" stroke-width="1.6"/><text x="44" y="68" font-size="15" font-weight="700" fill="#6BA8DE" text-anchor="start" opacity="1">The app</text><text x="44" y="96" font-size="12" font-weight="600" fill="#F2F2F7" text-anchor="start" opacity="1">1.  learns something new</text><text x="44" y="122" font-size="12" font-weight="500" fill="#F2F2F7" text-anchor="start" opacity="1">2.  writes a snapshot</text><text x="44" y="148" font-size="12" font-weight="500" fill="#F2F2F7" text-anchor="start" opacity="1">3.  asks WidgetKit to reload</text><rect x="44" y="152" width="122.8" height="24" rx="12.0" fill="#2A2A2E" stroke="#3A3A3D" stroke-width="1"/><text x="105.4" y="168.32" font-size="12" font-weight="600" fill="#F2F2F7" text-anchor="middle" opacity="1" class="m">WidgetReloader</text><rect x="392" y="30" width="216" height="170" rx="12" fill="#1F1F22" stroke="#6BA8DE" stroke-width="2" stroke-dasharray="7 5"/><text x="500" y="60" font-size="15" font-weight="700" fill="#6BA8DE" text-anchor="middle" opacity="1">OfflineStore</text><text x="500" y="80" font-size="11.5" font-weight="500" fill="#9A9AA0" text-anchor="middle" opacity="1">app-group container</text><rect x="467.4" y="98" width="65.19999999999999" height="24" rx="12.0" fill="#2A2A2E" stroke="#3A3A3D" stroke-width="1"/><text x="500.0" y="114.32" font-size="12" font-weight="600" fill="#F2F2F7" text-anchor="middle" opacity="1" class="m">agenda</text><rect x="467.4" y="124" width="65.19999999999999" height="24" rx="12.0" fill="#2A2A2E" stroke="#3A3A3D" stroke-width="1"/><text x="500.0" y="140.32" font-size="12" font-weight="600" fill="#F2F2F7" text-anchor="middle" opacity="1" class="m">career</text><rect x="453.0" y="150" width="94.0" height="24" rx="12.0" fill="#2A2A2E" stroke="#3A3A3D" stroke-width="1"/><text x="500.0" y="166.32" font-size="12" font-weight="600" fill="#F2F2F7" text-anchor="middle" opacity="1" class="m">free rooms</text><rect x="438.6" y="176" width="122.8" height="24" rx="12.0" fill="#2A2A2E" stroke="#3A3A3D" stroke-width="1"/><text x="500.0" y="192.32" font-size="12" font-weight="600" fill="#F2F2F7" text-anchor="middle" opacity="1" class="m">current lesson</text><path d="M330,112 L386,112" stroke="#6BA8DE" stroke-width="1.6" fill="none" marker-end="url(#acc)"/><text x="358" y="104" font-size="11" font-weight="600" fill="#6BA8DE" text-anchor="middle" opacity="1">writes</text><rect x="676" y="24" width="300" height="50" rx="10" fill="#2A2A2E" stroke="#63C2EF" stroke-width="1.4"/><text x="692" y="46" font-size="12.5" font-weight="700" fill="#F2F2F7" text-anchor="start" opacity="1">NextLectureWidget</text><text x="692" y="62" font-size="10.5" font-weight="400" fill="#9A9AA0" text-anchor="start" opacity="1">the next lesson, its room, the countdown</text><path d="M612,112 L670,49" stroke="#63C2EF" stroke-width="1.2" fill="none" marker-end="url(#a)"/><rect x="676" y="86" width="300" height="50" rx="10" fill="#2A2A2E" stroke="#63C2EF" stroke-width="1.4"/><text x="692" y="108" font-size="12.5" font-weight="700" fill="#F2F2F7" text-anchor="start" opacity="1">TodayWidget</text><text x="692" y="124" font-size="10.5" font-weight="400" fill="#9A9AA0" text-anchor="start" opacity="1">the day as a list</text><path d="M612,112 L670,111" stroke="#63C2EF" stroke-width="1.2" fill="none" marker-end="url(#a)"/><rect x="676" y="148" width="300" height="50" rx="10" fill="#2A2A2E" stroke="#63C2EF" stroke-width="1.4"/><text x="692" y="170" font-size="12.5" font-weight="700" fill="#F2F2F7" text-anchor="start" opacity="1">CareerWidget</text><text x="692" y="186" font-size="10.5" font-weight="400" fill="#9A9AA0" text-anchor="start" opacity="1">the average and the credits</text><path d="M612,112 L670,173" stroke="#63C2EF" stroke-width="1.2" fill="none" marker-end="url(#a)"/><rect x="676" y="210" width="300" height="50" rx="10" fill="#2A2A2E" stroke="#63C2EF" stroke-width="1.4"/><text x="692" y="232" font-size="12.5" font-weight="700" fill="#F2F2F7" text-anchor="start" opacity="1">FreeRoomsWidget</text><text x="692" y="248" font-size="10.5" font-weight="400" fill="#9A9AA0" text-anchor="start" opacity="1">free now, by campus</text><path d="M612,112 L670,235" stroke="#63C2EF" stroke-width="1.2" fill="none" marker-end="url(#a)"/><rect x="676" y="272" width="300" height="50" rx="10" fill="#2A2A2E" stroke="#63C2EF" stroke-width="1.4"/><text x="692" y="294" font-size="12.5" font-weight="700" fill="#F2F2F7" text-anchor="start" opacity="1">LectureLiveActivity</text><text x="692" y="310" font-size="10.5" font-weight="400" fill="#9A9AA0" text-anchor="start" opacity="1">Lock Screen and Dynamic Island</text><path d="M612,112 L670,297" stroke="#63C2EF" stroke-width="1.2" fill="none" marker-end="url(#a)"/><rect x="24" y="214" width="584" height="112" rx="12" fill="#2A2A2E" stroke="#4CD964" stroke-width="1.6" stroke-dasharray="6 5"/><text x="44" y="242" font-size="13.5" font-weight="700" fill="#4CD964" text-anchor="start" opacity="1">No token, no network, no waking the app</text><text x="44" y="266" font-size="11.5" font-weight="400" fill="#F2F2F7" text-anchor="start" opacity="1">A widget only ever reads. A timeline can be built with the app not running,</text><text x="44" y="283" font-size="11.5" font-weight="400" fill="#F2F2F7" text-anchor="start" opacity="1">and a widget that finds nothing draws the sample data — so a freshly placed</text><text x="44" y="300" font-size="11.5" font-weight="400" fill="#F2F2F7" text-anchor="start" opacity="1">widget is never blank.</text><text x="44" y="318" font-size="11" font-weight="600" fill="#9A9AA0" text-anchor="start" opacity="1">Everything outside — Siri, Shortcuts, a control, a notification — lands through AppDestination.</text></svg>