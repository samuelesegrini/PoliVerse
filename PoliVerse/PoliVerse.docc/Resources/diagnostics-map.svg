<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="396" viewBox="0 0 1000 396" role="img" aria-labelledby="t"><title id="t">What the app records about itself, and the two things that ever cross the device's edge.</title><style>text{font-family:-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Helvetica Neue', Arial, sans-serif} .m{font-family:ui-monospace, SFMono-Regular, Menlo, monospace}</style><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6C6C70"/></marker></defs><defs><marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2E7D3A"/></marker></defs><defs><marker id="w" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C25E10"/></marker></defs><rect x="24" y="48" width="636" height="330" rx="12" fill="#EFEFF4" stroke="#2E7D3A" stroke-width="2" stroke-dasharray="8 5"/><text x="44" y="78" font-size="15" font-weight="700" fill="#2E7D3A" text-anchor="start" opacity="1">Stays on this device</text><text x="44" y="98" font-size="11.5" font-weight="400" fill="#6C6C70" text-anchor="start" opacity="1">No analytics service, no crash reporter, nothing sent on its own.</text><rect x="44" y="116" width="596" height="40" rx="10" fill="#F7F7FA" stroke="#0F3D6E" stroke-width="1.4"/><rect x="44" y="116" width="5" height="40" rx="2.5" fill="#0F3D6E"/><text x="64" y="134" font-size="12.5" font-weight="700" fill="#1C1C1E" text-anchor="start" opacity="1" class="m">DiagnosticsCollector</text><text x="64" y="149" font-size="10.5" font-weight="400" fill="#6C6C70" text-anchor="start" opacity="1">session, scopes, WeBeep, queue, background runs</text><rect x="44" y="166" width="596" height="40" rx="10" fill="#F7F7FA" stroke="#2E7FB8" stroke-width="1.4"/><rect x="44" y="166" width="5" height="40" rx="2.5" fill="#2E7FB8"/><text x="64" y="184" font-size="12.5" font-weight="700" fill="#1C1C1E" text-anchor="start" opacity="1" class="m">PerformanceMonitor</text><text x="64" y="199" font-size="10.5" font-weight="400" fill="#6C6C70" text-anchor="start" opacity="1">MetricKit's daily payloads and hang reports</text><rect x="44" y="216" width="596" height="40" rx="10" fill="#F7F7FA" stroke="#2E7FB8" stroke-width="1.4"/><rect x="44" y="216" width="5" height="40" rx="2.5" fill="#2E7FB8"/><text x="64" y="234" font-size="12.5" font-weight="700" fill="#1C1C1E" text-anchor="start" opacity="1" class="m">ReportArchive</text><text x="64" y="249" font-size="10.5" font-weight="400" fill="#6C6C70" text-anchor="start" opacity="1">those reports, on disk</text><rect x="44" y="266" width="596" height="40" rx="10" fill="#F7F7FA" stroke="#6155C8" stroke-width="1.4"/><rect x="44" y="266" width="5" height="40" rx="2.5" fill="#6155C8"/><text x="64" y="284" font-size="12.5" font-weight="700" fill="#1C1C1E" text-anchor="start" opacity="1" class="m">StorageAudit</text><text x="64" y="299" font-size="10.5" font-weight="400" fill="#6C6C70" text-anchor="start" opacity="1">what the app is holding, by kind</text><rect x="44" y="316" width="596" height="40" rx="10" fill="#F7F7FA" stroke="#6155C8" stroke-width="1.4"/><rect x="44" y="316" width="5" height="40" rx="2.5" fill="#6155C8"/><text x="64" y="334" font-size="12.5" font-weight="700" fill="#1C1C1E" text-anchor="start" opacity="1" class="m">DiagnosticsLog</text><text x="64" y="349" font-size="10.5" font-weight="400" fill="#6C6C70" text-anchor="start" opacity="1">background runs and their outcomes</text><rect x="700" y="48" width="276" height="120" rx="12" fill="#F7F7FA" stroke="#C25E10" stroke-width="1.6"/><text x="720" y="76" font-size="13" font-weight="700" fill="#C25E10" text-anchor="start" opacity="1" class="m">ConnectionProbe</text><text x="720" y="98" font-size="11" font-weight="500" fill="#1C1C1E" text-anchor="start" opacity="1">The one part that reaches out.</text><text x="720" y="116" font-size="11" font-weight="400" fill="#6C6C70" text-anchor="start" opacity="1">Asks each service whether it is</text><text x="720" y="132" font-size="11" font-weight="400" fill="#6C6C70" text-anchor="start" opacity="1">there, with no credentials. A 404</text><text x="720" y="148" font-size="11" font-weight="400" fill="#6C6C70" text-anchor="start" opacity="1">counts as reachable.</text><path d="M666,108 L694,108" stroke="#C25E10" stroke-width="1.6" fill="none" marker-end="url(#w)"/><rect x="700" y="196" width="276" height="108" rx="12" fill="#F7F7FA" stroke="#2E7D3A" stroke-width="1.6"/><text x="720" y="224" font-size="13" font-weight="700" fill="#2E7D3A" text-anchor="start" opacity="1" class="m">DiagnosticsReport</text><text x="720" y="246" font-size="11" font-weight="500" fill="#1C1C1E" text-anchor="start" opacity="1">Plain text, to attach to a report.</text><text x="720" y="264" font-size="11" font-weight="400" fill="#6C6C70" text-anchor="start" opacity="1">The matricola only if asked.</text><text x="720" y="282" font-size="11" font-weight="400" fill="#6C6C70" text-anchor="start" opacity="1">Never a token or a password —</text><text x="720" y="298" font-size="11" font-weight="400" fill="#6C6C70" text-anchor="start" opacity="1">stripped even out of an error.</text><path d="M666,250 L694,250" stroke="#2E7D3A" stroke-width="1.6" fill="none" marker-end="url(#g)"/><rect x="700" y="332" width="276" height="46" rx="12" fill="#EFEFF4" stroke="#D6D6DB" stroke-width="1"/><text x="838" y="352" font-size="11" font-weight="600" fill="#1C1C1E" text-anchor="middle" opacity="1">Leaves the device only when</text><text x="838" y="368" font-size="11" font-weight="600" fill="#1C1C1E" text-anchor="middle" opacity="1">the student shares it.</text><path d="M838,308 L838,328" stroke="#6C6C70" stroke-width="1.6" fill="none" marker-end="url(#a)"/></svg>