<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="528" viewBox="0 0 1000 528" role="img" aria-labelledby="t"><title id="t">The OAuth sign-in as a sequence between the app, the web view, the identity provider and the token store.</title><style>text{font-family:-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Helvetica Neue', Arial, sans-serif} .m{font-family:ui-monospace, SFMono-Regular, Menlo, monospace}</style><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9A9AA0"/></marker></defs><defs><marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4CD964"/></marker></defs><rect x="90.8" y="28" width="78.4" height="34" rx="8" fill="#2A2A2E" stroke="#6BA8DE" stroke-width="1.6"/><text x="130" y="50" font-size="12.5" font-weight="700" fill="#F2F2F7" text-anchor="middle" opacity="1">The app</text><path d="M130,76 L130,396" stroke="#48484A" stroke-width="1.4" stroke-dasharray="5 5"/><rect x="306.4" y="28" width="107.2" height="34" rx="8" fill="#2A2A2E" stroke="#A79BFF" stroke-width="1.6"/><text x="360" y="50" font-size="12.5" font-weight="700" fill="#F2F2F7" text-anchor="middle" opacity="1">AuthWebView</text><path d="M360,76 L360,396" stroke="#48484A" stroke-width="1.4" stroke-dasharray="5 5"/><rect x="541.2" y="28" width="157.6" height="34" rx="8" fill="#2A2A2E" stroke="#FF9F45" stroke-width="1.6"/><text x="620" y="50" font-size="12.5" font-weight="700" fill="#F2F2F7" text-anchor="middle" opacity="1">oauthidp.polimi.it</text><path d="M620,76 L620,396" stroke="#48484A" stroke-width="1.4" stroke-dasharray="5 5"/><rect x="830.0" y="28" width="100.0" height="34" rx="8" fill="#2A2A2E" stroke="#4CD964" stroke-width="1.6"/><text x="880" y="50" font-size="12.5" font-weight="700" fill="#F2F2F7" text-anchor="middle" opacity="1">TokenStore</text><path d="M880,76 L880,396" stroke="#48484A" stroke-width="1.4" stroke-dasharray="5 5"/><path d="M130,108 L360,108" stroke="#9A9AA0" stroke-width="1.6" fill="none" marker-end="url(#a)"/><rect x="158.60000000000002" y="82" width="172.79999999999998" height="20" rx="6" fill="#1F1F22" stroke="none" stroke-width="0"/><text x="245.0" y="97" font-size="11.5" font-weight="550" fill="#F2F2F7" text-anchor="middle" opacity="1">open the provider's own page</text><path d="M360,148 L620,148" stroke="#9A9AA0" stroke-width="1.6" fill="none" marker-end="url(#a)"/><rect x="347.6" y="122" width="284.79999999999995" height="20" rx="6" fill="#1F1F22" stroke="none" stroke-width="0"/><text x="490.0" y="137" font-size="11.5" font-weight="550" fill="#F2F2F7" text-anchor="middle" opacity="1">credentials, SPID or CIE — never through the app</text><path d="M620,196 L360,196" stroke="#4CD964" stroke-width="1.6" fill="none" marker-end="url(#g)"/><rect x="398.0" y="170" width="184.0" height="20" rx="6" fill="#1F1F22" stroke="none" stroke-width="0"/><text x="490.0" y="185" font-size="11.5" font-weight="550" fill="#F2F2F7" text-anchor="middle" opacity="1">redirect to redirectURI?code=…</text><path d="M360,236 L880,236" stroke="#9A9AA0" stroke-width="1.6" fill="none" marker-end="url(#a)"/><rect x="564.4" y="210" width="111.19999999999999" height="20" rx="6" fill="#1F1F22" stroke="none" stroke-width="0"/><text x="620.0" y="225" font-size="11.5" font-weight="550" fill="#F2F2F7" text-anchor="middle" opacity="1">exchange the code</text><path d="M880,276 L620,276" stroke="#9A9AA0" stroke-width="1.6" fill="none" marker-end="url(#a)"/><rect x="705.6" y="250" width="88.8" height="20" rx="6" fill="#1F1F22" stroke="none" stroke-width="0"/><text x="750.0" y="265" font-size="11.5" font-weight="550" fill="#F2F2F7" text-anchor="middle" opacity="1">token request</text><path d="M620,316 L880,316" stroke="#4CD964" stroke-width="1.6" fill="none" marker-end="url(#g)"/><rect x="683.2" y="290" width="133.6" height="20" rx="6" fill="#1F1F22" stroke="none" stroke-width="0"/><text x="750.0" y="305" font-size="11.5" font-weight="550" fill="#F2F2F7" text-anchor="middle" opacity="1">access + refresh pair</text><path d="M880,360 L130,360" stroke="#4CD964" stroke-width="1.6" fill="none" marker-end="url(#g)"/><rect x="471.8" y="334" width="66.4" height="20" rx="6" fill="#1F1F22" stroke="none" stroke-width="0"/><text x="505.0" y="349" font-size="11.5" font-weight="550" fill="#F2F2F7" text-anchor="middle" opacity="1">signed in</text><rect x="24" y="416" width="952" height="100" rx="12" fill="#2A2A2E" stroke="#4CD964" stroke-width="1.6"/><text x="44" y="444" font-size="13.5" font-weight="700" fill="#4CD964" text-anchor="start" opacity="1">TokenStore is an actor, and that is the point</text><text x="44" y="466" font-size="11.5" font-weight="400" fill="#F2F2F7" text-anchor="start" opacity="1">The Politecnico rotates the refresh token. Two concurrent refreshes would present a token the other has already</text><text x="44" y="483" font-size="11.5" font-weight="400" fill="#F2F2F7" text-anchor="start" opacity="1">invalidated and end the session — so the first request starts the refresh and the rest await the same task.</text><text x="44" y="504" font-size="11.5" font-weight="600" fill="#9A9AA0" text-anchor="start" opacity="1">A transport failure leaves the pair alone. Only a refusal from the provider clears it.</text></svg>