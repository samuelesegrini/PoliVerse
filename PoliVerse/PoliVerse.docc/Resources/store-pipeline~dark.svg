<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="452" viewBox="0 0 1000 452" role="img" aria-labelledby="t"><title id="t">A load through the Store pipeline, what happens when it fails, and how a write goes the other way.</title><style>text{font-family:-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Helvetica Neue', Arial, sans-serif} .m{font-family:ui-monospace, SFMono-Regular, Menlo, monospace}</style><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9A9AA0"/></marker></defs><defs><marker id="ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4CD964"/></marker></defs><defs><marker id="no" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#FF9F45"/></marker></defs><rect x="24" y="44" width="220" height="62" rx="12" fill="#2A2A2E" stroke="#A79BFF" stroke-width="1.6"/><text x="40" y="70" font-size="15" font-weight="700" fill="#F2F2F7" text-anchor="start" opacity="1">View</text><text x="40" y="90" font-size="11" font-weight="400" fill="#9A9AA0" text-anchor="start" opacity="1">.task { await model.load() }</text><rect x="269" y="44" width="220" height="62" rx="12" fill="#2A2A2E" stroke="#63C2EF" stroke-width="1.6"/><text x="285" y="70" font-size="15" font-weight="700" fill="#F2F2F7" text-anchor="start" opacity="1">Model</text><text x="285" y="90" font-size="11" font-weight="400" fill="#9A9AA0" text-anchor="start" opacity="1">observable, no fetching of its own</text><path d="M247,75 L265,75" stroke="#9A9AA0" stroke-width="1.6" fill="none" marker-end="url(#a)"/><rect x="514" y="44" width="220" height="62" rx="12" fill="#2A2A2E" stroke="#6BA8DE" stroke-width="1.6"/><text x="530" y="70" font-size="15" font-weight="700" fill="#F2F2F7" text-anchor="start" opacity="1">Store</text><text x="530" y="90" font-size="11" font-weight="400" fill="#9A9AA0" text-anchor="start" opacity="1">drives one Source</text><path d="M492,75 L510,75" stroke="#9A9AA0" stroke-width="1.6" fill="none" marker-end="url(#a)"/><rect x="759" y="44" width="220" height="62" rx="12" fill="#2A2A2E" stroke="#6BA8DE" stroke-width="1.6"/><text x="775" y="70" font-size="15" font-weight="700" fill="#F2F2F7" text-anchor="start" opacity="1">Source</text><text x="775" y="90" font-size="11" font-weight="400" fill="#9A9AA0" text-anchor="start" opacity="1">cache key, request, decoding</text><path d="M737,75 L755,75" stroke="#9A9AA0" stroke-width="1.6" fill="none" marker-end="url(#a)"/><text x="24" y="150" font-size="13" font-weight="700" fill="#9A9AA0" text-anchor="start" opacity="1">What one load() does, in order</text><rect x="24" y="172" width="640" height="44" rx="10" fill="#1F1F22" stroke="#3A3A3D" stroke-width="1"/><circle cx="48" cy="194" r="13" fill="#4CD964"/><text x="48" y="199" font-size="13" font-weight="700" fill="#101014" text-anchor="middle" opacity="1">1</text><text x="72" y="193" font-size="13.5" font-weight="650" fill="#F2F2F7" text-anchor="start" opacity="1">read the cache and publish it</text><text x="72" y="208" font-size="11" font-weight="400" fill="#9A9AA0" text-anchor="start" opacity="1">the first frame already has something to draw</text><rect x="24" y="228" width="640" height="44" rx="10" fill="#1F1F22" stroke="#3A3A3D" stroke-width="1"/><circle cx="48" cy="250" r="13" fill="#6BA8DE"/><text x="48" y="255" font-size="13" font-weight="700" fill="#101014" text-anchor="middle" opacity="1">2</text><text x="72" y="249" font-size="13.5" font-weight="650" fill="#F2F2F7" text-anchor="start" opacity="1">ask the LoadWindow</text><text x="72" y="264" font-size="11" font-weight="400" fill="#9A9AA0" text-anchor="start" opacity="1">is a refresh due at all?</text><rect x="24" y="284" width="640" height="44" rx="10" fill="#1F1F22" stroke="#3A3A3D" stroke-width="1"/><circle cx="48" cy="306" r="13" fill="#6BA8DE"/><text x="48" y="311" font-size="13" font-weight="700" fill="#101014" text-anchor="middle" opacity="1">3</text><text x="72" y="305" font-size="13.5" font-weight="650" fill="#F2F2F7" text-anchor="start" opacity="1">fetch, decode, write the cache</text><text x="72" y="320" font-size="11" font-weight="400" fill="#9A9AA0" text-anchor="start" opacity="1">through HTTP / PoliMiAPI</text><rect x="24" y="340" width="640" height="44" rx="10" fill="#1F1F22" stroke="#3A3A3D" stroke-width="1"/><circle cx="48" cy="362" r="13" fill="#63C2EF"/><text x="48" y="367" font-size="13" font-weight="700" fill="#101014" text-anchor="middle" opacity="1">4</text><text x="72" y="361" font-size="13.5" font-weight="650" fill="#F2F2F7" text-anchor="start" opacity="1">publish, then record</text><text x="72" y="376" font-size="11" font-weight="400" fill="#9A9AA0" text-anchor="start" opacity="1">DataStatus and the FreshnessCoordinator</text><rect x="692" y="172" width="284" height="156" rx="12" fill="#2A2A2E" stroke="#FF9F45" stroke-width="1.6" stroke-dasharray="6 5"/><text x="712" y="198" font-size="13.5" font-weight="700" fill="#FF9F45" text-anchor="start" opacity="1">When a refresh fails</text><text x="712" y="222" font-size="11.5" font-weight="400" fill="#F2F2F7" text-anchor="start" opacity="1">the cached value stays published,</text><text x="712" y="241" font-size="11.5" font-weight="400" fill="#F2F2F7" text-anchor="start" opacity="1">the failure is recorded beside it,</text><text x="712" y="260" font-size="11.5" font-weight="400" fill="#F2F2F7" text-anchor="start" opacity="1">and the screen says how old it is.</text><text x="712" y="296" font-size="11.5" font-weight="600" fill="#9A9AA0" text-anchor="start" opacity="1">An empty screen says less</text><text x="712" y="313" font-size="11.5" font-weight="600" fill="#9A9AA0" text-anchor="start" opacity="1">than a stale one with a date on it.</text><path d="M664,250 L688,250" stroke="#FF9F45" stroke-width="1.6" fill="none" marker-end="url(#no)"/><rect x="24" y="366" width="952" height="74" rx="12" fill="#1F1F22" stroke="#3A3A3D" stroke-width="1"/><text x="44" y="393" font-size="13.5" font-weight="700" fill="#6BA8DE" text-anchor="start" opacity="1">Writing goes the other way</text><text x="44" y="414" font-size="11.5" font-weight="400" fill="#9A9AA0" text-anchor="start" opacity="1">PendingChanges applies the change at once through OptimisticFlags, so the screen updates under the finger,</text><text x="44" y="430" font-size="11.5" font-weight="400" fill="#9A9AA0" text-anchor="start" opacity="1">and queues the real request in the ActionQueue, which sends it when the network comes back.</text></svg>