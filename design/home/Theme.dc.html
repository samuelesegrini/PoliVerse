<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@125,800;125,900&amp;display=swap">
  <style>
    body { margin: 0; font-family: -apple-system, "SF Pro Text", system-ui, "Helvetica Neue", sans-serif; -webkit-font-smoothing: antialiased; color: #1A1715; }
    a { color: #E8751A; } a:hover { color: #C45F0E; }
    .wide { font-family: Archivo, "Helvetica Neue", Arial, sans-serif; font-stretch: 125%; font-weight: 900; }
    .serif { font-family: "New York", ui-serif, Georgia, serif; }
  </style>
</helmet>
<div style="width: 402px; height: 1100px; position: relative; overflow: hidden; {{th.bgStyle}}">
  <div style="position: relative; padding: 64px 26px 0 26px; display: flex; flex-direction: column; gap: 10px; opacity: 0.55;">
    <span style="font-size: 19px; font-weight: 600;">Buona giornata, Samuele!</span>
    <div style="display: flex; justify-content: space-between; align-items: center;"><div class="wide" style="display: flex; flex-direction: column; font-size: 66px; line-height: 0.98; color: #111;"><span>14.09</span><span>LUN</span></div><span style="font-size: 26px; font-weight: 700; color: {{th.accent}}; text-align: right; line-height: 1.05; margin-top: 46px;">Tutto<br>pronto?</span></div>
  </div>
  <div style="position: absolute; left: 0; right: 0; top: 330px; bottom: 0; border-radius: 34px 34px 0 0; background: {{th.sheet}}; box-shadow: 0 -8px 30px rgba(0,0,0,0.12); display: flex; flex-direction: column; gap: 22px; padding: 22px 22px 0 22px;">
    <div style="display: flex; justify-content: space-between; align-items: center;"><span style="font-size: 26px; font-weight: 700;">Tema</span><span style="width: 32px; height: 32px; border-radius: 16px; background: {{th.accent}}; color: #fff; display: flex; align-items: center; justify-content: center;"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M6 6l12 12 M18 6L6 18"></path></svg></span></div>
    <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); grid-template-rows: 150px 130px; gap: 10px;">
      <div style="border-radius: 26px; overflow: hidden; position: relative; {{th.bgStyle}} box-shadow: inset 0 0 0 1px rgba(0,0,0,0.05);"><span style="position: absolute; left: 14px; bottom: 12px; font-size: 16px; font-weight: 600; font-style: italic;">Materiale</span></div>
      <div style="border-radius: 26px; background: linear-gradient(135deg, {{th.glossTop}}, {{th.accent}}); color: #fff; display: flex; flex-direction: column; align-items: center; justify-content: center;"><span class="wide" style="font-size: 24px; font-style: italic;">Colore</span><span style="font-size: 14px; opacity: 0.9;">{{th.accent}}</span></div>
      <div style="border-radius: 26px; background: rgba(255,255,255,0.7); padding: 12px 14px; display: flex; flex-direction: column; justify-content: space-between;"><span class="wide" style="font-size: 30px; line-height: 0.95;">14.09<br>LUN</span><span style="font-size: 15px; font-weight: 600; font-style: italic;">Widget</span></div>
      <div style="border-radius: 26px; background: rgba(255,255,255,0.7); padding: 12px 14px; display: flex; flex-direction: column; justify-content: space-between; align-items: flex-end;"><span style="font-size: 22px; font-weight: 700; color: {{th.accent}};">Tutto pronto?</span><span style="font-size: 15px; font-weight: 600; font-style: italic; color: #57524D;">Accessorio</span></div>
    </div>
    <div style="display: flex; flex-direction: column; gap: 12px;">
      <span style="font-size: 18px; font-weight: 600; color: #8A847E;">Colore</span>
      <div style="display: flex; gap: 18px; padding: 0 4px;">
        <sc-for list="{{swatches}}" as="s" hint-placeholder-count="4"><div style="display: flex; flex-direction: column; align-items: center; gap: 6px;"><span style="width: 52px; height: 52px; border-radius: 26px; background: {{s.color}}; box-shadow: {{s.ring}};"></span><span style="font-size: 13px; color: #57524D;">{{s.name}}</span></div></sc-for>
      </div>
    </div>
    <div style="display: flex; flex-direction: column; gap: 12px;">
      <span style="font-size: 18px; font-weight: 600; color: #8A847E;">Materiale</span>
      <div style="display: flex; gap: 10px;">
        <div style="flex: 1; height: 86px; border-radius: 22px; background-color: #fff; background-image: linear-gradient(rgba(0,0,0,0.12) 1px, transparent 1px), linear-gradient(90deg, rgba(0,0,0,0.12) 1px, transparent 1px); background-size: 10px 10px; display: flex; align-items: flex-end; padding: 8px 12px; box-sizing: border-box; font-size: 13px; font-weight: 600;">Griglia</div>
        <div style="flex: 1; height: 86px; border-radius: 22px; background: #fff; display: flex; align-items: flex-end; padding: 8px 12px; box-sizing: border-box; font-size: 13px; font-weight: 600; background-image: radial-gradient(rgba(0,0,0,0.25) 1.3px, transparent 1.4px); background-size: 11px 11px;">Puntini</div>
        <div style="flex: 1; height: 86px; border-radius: 22px; background: #fff; display: flex; align-items: flex-end; padding: 8px 12px; box-sizing: border-box; font-size: 13px; font-weight: 600; box-shadow: inset 0 0 0 2px {{th.accent}}; background-image: url(&quot;data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 width=%2718%27 height=%2724%27%3E%3Crect x=%272%27 y=%272%27 width=%2714%27 height=%2720%27 rx=%277%27 fill=%27none%27 stroke=%27rgba(0,0,0,0.22)%27 stroke-width=%271.5%27/%3E%3C/svg%3E&quot;); background-size: 18px 24px;">Maglia ovale</div>
      </div>
    </div>
    <div style="position: absolute; left: 22px; right: 22px; bottom: 34px; display: flex; gap: 12px;">
      <div style="flex-grow: 1; height: 60px; border-radius: 30px; display: flex; align-items: center; justify-content: center; gap: 8px; font-size: 19px; font-weight: 600; {{th.gloss}}"><svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3a9 9 0 1 0 0 18c1 0 1.5-.7 1.5-1.5 0-1.3-1-1.5-1-2.5s.8-1.5 2-1.5H17a4 4 0 0 0 4-4c0-4.7-4-8.5-9-8.5z M7.5 11h.01 M10 7.5h.01 M14.5 7.5h.01"></path></svg>Applica tema</div>
      <div style="flex: 0 0 60px; height: 60px; border-radius: 30px; background: rgba(255,255,255,0.7); box-shadow: inset 0 0 0 1.5px {{th.accent}}; color: {{th.accent}}; display: flex; align-items: center; justify-content: center;"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M6 12h.01 M12 12h.01 M18 12h.01"></path></svg></div>
    </div>
  </div>
</div>
</x-dc>
<script data-dc-script data-props='{"theme":{"editor":"enum","options":["Arancio","Viola","Blu","Rosa"],"default":"Arancio"},"pattern":{"editor":"enum","options":["Griglia","Maglia ovale","Puntini"],"default":"Griglia"},"$preview":{"width":402,"height":1100}}'>
class Component extends DCLogic {
  renderVals() {
    const themes = {
      Arancio: { accent: '#E8751A', accentSoft: '#F7E9DC', ink: '#B35A10', line: '232,117,26', sheet: '#F6F0EA', glossTop: '#FFD9B5', glossBot: '#F6B27A' },
      Viola:   { accent: '#6F63D9', accentSoft: '#E6E3F3', ink: '#4B41A8', line: '111,99,217', sheet: '#EFEDF6', glossTop: '#D9D4FA', glossBot: '#AFA6EE' },
      Blu:     { accent: '#2F80D9', accentSoft: '#E1ECF3', ink: '#1F5C9E', line: '47,128,217', sheet: '#ECF3F6', glossTop: '#CFE6FA', glossBot: '#8DC3F0' },
      Rosa:    { accent: '#D9557A', accentSoft: '#F6E6EA', ink: '#A83858', line: '217,85,122', sheet: '#F5EDEF', glossTop: '#FAD3DE', glossBot: '#F0A0B6' }
    };
    const th = themes[this.props.theme ?? 'Arancio'] ?? themes.Arancio;
    const L = th.line;
    const svg = (s) => 'url("data:image/svg+xml,' + encodeURIComponent(s) + '")';
    const patterns = {
      'Griglia': 'linear-gradient(rgba(' + L + ',0.30) 1px, transparent 1px), linear-gradient(90deg, rgba(' + L + ',0.30) 1px, transparent 1px), linear-gradient(rgba(' + L + ',0.11) 1px, transparent 1px), linear-gradient(90deg, rgba(' + L + ',0.11) 1px, transparent 1px)',
      'Maglia ovale': svg('<svg xmlns="http://www.w3.org/2000/svg" width="34" height="46"><rect x="4" y="4" width="26" height="38" rx="13" fill="none" stroke="rgba(' + L + ',0.28)" stroke-width="2.2"/></svg>'),
      'Puntini': 'radial-gradient(rgba(' + L + ',0.35) 1.4px, transparent 1.5px)'
    };
    const sizes = { 'Griglia': '93px 93px, 93px 93px, 9.3px 9.3px, 9.3px 9.3px', 'Maglia ovale': '34px 46px', 'Puntini': '14px 14px' };
    const p = this.props.pattern ?? 'Griglia';
    th.bgStyle = 'background-color: ' + th.accentSoft + '; background-image: ' + patterns[p] + '; background-size: ' + sizes[p] + '; background-position: -8px 10px;';
    th.gloss = 'background: linear-gradient(180deg, ' + th.glossTop + ' 0%, ' + th.glossBot + ' 100%); box-shadow: inset 0 1.5px 0 rgba(255,255,255,0.8), inset 0 0 0 1.5px ' + th.accent + '55, 0 10px 26px ' + th.accent + '40; color: ' + th.ink + ';';

    const names = ['Arancio', 'Viola', 'Blu', 'Rosa'];
    const swatches = names.map((n) => ({ name: n, color: themes[n].accent, ring: n === (this.props.theme ?? 'Arancio') ? '0 0 0 3px #fff, 0 0 0 5.5px ' + themes[n].accent : 'none' }));
    return { th, swatches };
  }
}
</script>
</body>
</html>
