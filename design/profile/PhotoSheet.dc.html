<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    body { margin: 0; background: #2B2B2E; font-family: -apple-system, "SF Pro Text", system-ui, "Helvetica Neue", sans-serif; -webkit-font-smoothing: antialiased; color: #000; }
    a { color: #003352; } a:hover { color: #00233A; }
    .mono { font-family: ui-monospace, "SF Mono", Menlo, monospace; font-variant-numeric: tabular-nums; }
    .glass { background: rgba(120,120,128,0.12); box-shadow: inset 0 1px 0 rgba(255,255,255,0.9), 0 0 0 0.5px rgba(0,0,0,0.04); }
  </style>
</helmet>
<div style="width: 402px; height: 874px; position: relative; overflow: hidden; background: #F2F2F7;">
  <div style="position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; padding-top: 82px; gap: 10px;">
    <div style="width: 112px; height: 112px; border-radius: 50%; background: #003352;"></div>
    <div style="width: 210px; height: 22px; border-radius: 11px; background: #D1D1D6;"></div>
    <div style="width: 260px; height: 14px; border-radius: 7px; background: #E5E5EA;"></div>
    <div style="align-self: stretch; margin: 26px 16px 0 16px; height: 150px; border-radius: 26px; background: #fff;"></div>
  </div>
  <div style="position: absolute; inset: 0; background: rgba(0,0,0,0.26);"></div>
  <div style="position: absolute; left: 0; right: 0; top: 262px; bottom: 0; background: #fff; border-radius: 38px 38px 0 0; box-shadow: 0 -8px 30px rgba(0,0,0,0.12);">
    <div style="position: absolute; top: 6px; left: 50%; margin-left: -18px; width: 36px; height: 5px; border-radius: 3px; background: rgba(60,60,67,0.3);"></div>
    <div style="position: absolute; top: 18px; right: 18px; width: 44px; height: 44px; border-radius: 22px; display: flex; align-items: center; justify-content: center; color: #3A3A3C;" class="glass"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 6l12 12 M18 6L6 18"></path></svg></div>
    <div style="display: flex; flex-direction: column; align-items: center; padding: 34px 24px 0 24px; gap: 6px;">
      <span style="font-size: 22px; font-weight: 700;">Foto</span>
      <div style="width: 150px; height: 150px; margin-top: 18px; {{clip}} background: linear-gradient(180deg, #1D5E86 0%, #003352 100%); color: #fff; display: flex; align-items: center; justify-content: center; font-family: ui-rounded, 'SF Pro Rounded', system-ui; font-size: 58px; font-weight: 600;">SS</div>
    </div>
    <div style="margin: 26px 20px 0 20px; height: 40px; border-radius: 20px; background: rgba(120,120,128,0.12); padding: 3px; box-sizing: border-box; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 0;">
      <span style="display: flex; align-items: center; justify-content: center; font-size: 15px; color: rgba(60,60,67,0.35);">Foto del Politecnico</span>
      <span style="display: flex; align-items: center; justify-content: center; border-radius: 17px; background: #fff; box-shadow: 0 2px 8px rgba(0,0,0,0.1); font-size: 15px; font-weight: 600;">Iniziali</span>
    </div>
    <span style="display: block; font-size: 13px; color: rgba(60,60,67,0.6); text-align: center; padding: 8px 32px 0 32px;">Il Politecnico non ha una tua foto.</span>
    <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 0; padding: 22px 20px 0 20px;">
      <sc-for list="{{shapes}}" as="s" hint-placeholder-count="3">
        <div style="display: flex; flex-direction: column; align-items: center; gap: 8px;">
          <div style="width: 70px; height: 70px; border-radius: 50%; box-shadow: {{s.ring}}; display: flex; align-items: center; justify-content: center;">
            <div style="width: 56px; height: 56px; {{s.clip}} background: {{s.fill}};"></div>
          </div>
          <span style="font-size: 13px; font-weight: {{s.weight}}; color: {{s.color}};">{{s.label}}</span>
        </div>
      </sc-for>
    </div>
    <div style="position: absolute; left: 20px; right: 20px; bottom: 40px;">
      <div style="height: 52px; border-radius: 26px; background: #003352; color: #fff; display: flex; align-items: center; justify-content: center; font-size: 17px; font-weight: 600;">Fine</div>
    </div>
  </div>
</div>
</x-dc>
<script data-dc-script data-props='{"shape":{"editor":"enum","options":["Cerchio","Quadrato","Coccarda"],"default":"Coccarda"},"$preview":{"width":402,"height":874}}'>
class Component extends DCLogic {
  clip(name) {
    if (name === 'Quadrato') return 'border-radius: 28%;';
    if (name === 'Coccarda') {
      const pts = [];
      for (let i = 0; i < 180; i++) {
        const a = i / 180 * Math.PI * 2;
        const r = 47 + 3 * Math.cos(12 * a);
        pts.push((50 + r * Math.cos(a)).toFixed(2) + '% ' + (50 + r * Math.sin(a)).toFixed(2) + '%');
      }
      return 'clip-path: polygon(' + pts.join(', ') + ');';
    }
    return 'border-radius: 50%;';
  }
  renderVals() {
    const shape = this.props.shape ?? 'Coccarda';
    const shapes = ['Cerchio', 'Quadrato', 'Coccarda'].map((label) => ({
      label,
      clip: this.clip(label),
      fill: label === shape ? '#003352' : '#D1D1D6',
      ring: label === shape ? '0 0 0 2.5px #003352' : 'none',
      weight: label === shape ? '600' : '400',
      color: label === shape ? '#003352' : 'rgba(60,60,67,0.6)'
    }));
    return { clip: this.clip(shape), shapes };
  }
}
</script>
</body>
</html>
