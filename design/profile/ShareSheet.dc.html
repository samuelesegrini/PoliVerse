<div style="width: 402px; height: 874px; position: relative; overflow: hidden; background: #F2F2F7;">

    <div style="align-self: stretch; margin: 26px 16px 0 16px; height: 150px; border-radius: 26px; background: #fff;"></div>
  </div>
  <div style="position: absolute; inset: 0; background: rgba(0,0,0,0.26);"></div>
  <div style="position: absolute; left: 0; right: 0; top: 236px; bottom: 0; background: #fff; border-radius: 38px 38px 0 0; box-shadow: 0 -8px 30px rgba(0,0,0,0.12);">
    <div style="position: absolute; top: 6px; left: 50%; margin-left: -18px; width: 36px; height: 5px; border-radius: 3px; background: rgba(60,60,67,0.3);"></div>
    <div style="position: absolute; top: 18px; right: 18px; width: 44px; height: 44px; border-radius: 22px; display: flex; align-items: center; justify-content: center; color: #3A3A3C;" class="glass"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 6l12 12 M18 6L6 18"></path></svg></div>
    <div style="display: flex; flex-direction: column; align-items: center; padding: 34px 28px 0 28px; gap: 6px;">
      <span style="font-size: 22px; font-weight: 700;">Il tuo contatto</span>
      <span style="font-size: 15px; color: rgba(60,60,67,0.6); text-align: center; text-wrap: pretty;">Fallo inquadrare a un compagno per salvare nome ed email.</span>

        <div style="width: 200px; height: 200px; display: grid; grid-template-columns: repeat(25, minmax(0, 1fr)); gap: 0;">

</x-dc>
<script data-dc-script data-props='{"$preview":{"width":402,"height":874}}'>
class Component extends DCLogic {
  renderVals() {
    const n = 25;
    let seed = 20260915;
    const rnd = () => { seed = (seed * 1103515245 + 12345) % 2147483648; return seed / 2147483648; };
    const finder = (r, c, r0, c0) => {
      const y = r - r0, x = c - c0;
      if (y < 0 || x < 0 || y > 6 || x > 6) return null;
      const edge = y === 0 || y === 6 || x === 0 || x === 6;
      const core = y >= 2 && y <= 4 && x >= 2 && x <= 4;
      return edge || core;
    };
    const cells = [];
    for (let r = 0; r < n; r++) {
      for (let c = 0; c < n; c++) {
        let on = finder(r, c, 0, 0);
        if (on === null) on = finder(r, c, 0, n - 7);
        if (on === null) on = finder(r, c, n - 7, 0);
        const nearFinder = (r < 8 && c < 8) || (r < 8 && c > n - 9) || (r > n - 9 && c < 8);
        if (on === null) on = nearFinder ? false : rnd() > 0.52;
        cells.push({ fill: on ? '#003352' : 'transparent', round: on && !nearFinder ? '2px' : '0' });
      }
    }
    return { cells };
  }
}
</script>
