        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#3C3C43" stroke-width="2.6" stroke-linecap="round">

    </div>

    <div style="flex: 1 1 auto; display: flex; align-items: center; justify-content: center; min-height: 0; padding: 0 20px">

          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#3C3C43" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M4.5 9.5A8 8 0 0 1 19 8"></path><path d="M19.5 14.5A8 8 0 0 1 5 16"></path>
            <path d="M19.5 4.5V8H16"></path><path d="M4.5 19.5V16H8"></path>
          </svg>
        </div>

        <div style="display: flex; flex-direction: column; gap: 11px">
          <div class="ctl-label">MATERIALE</div>
          <div style="display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 7px">
            <div style="display: flex; flex-direction: column; gap: 6px; align-items: center">
              <div style="width: 100%; height: 52px; border-radius: 13px; background: {{card}}; border: 2.5px solid {{accent}}; box-sizing: border-box"></div>
              <div class="swatch-name" style=" font-weight: 600; text-align: center; line-height: 1.15">Come la pagina</div>
            </div>
            <div style="display: flex; flex-direction: column; gap: 6px; align-items: center">
              <div style="width: 100%; height: 52px; border-radius: 13px; background: rgba(60,60,67,0.10); border: 1px solid rgba(60,60,67,0.12); box-sizing: border-box"></div>
              <div class="swatch-name" style=" text-align: center; line-height: 1.15">Morbido</div>
            </div>
            <div style="display: flex; flex-direction: column; gap: 6px; align-items: center">
              <div style="width: 100%; height: 52px; border-radius: 13px; background: {{surface}}; border: 1px solid rgba(60,60,67,0.12); box-sizing: border-box"></div>

            </div>

              <div class="swatch-name" style=" text-align: center; line-height: 1.15">Vetro</div>
            </div>
            <div style="display: flex; flex-direction: column; gap: 6px; align-items: center">

        <div style="display: flex; flex-direction: column; gap: 11px">

        <div style="display: flex; flex-direction: column; gap: 14px">
          <div style="display: flex; align-items: center; gap: 10px">
            <div class="row-label" style="flex: 1 1 auto">Elementi mostrati</div>
            <div style="display: flex; align-items: center; gap: 12px">
              <span style="font-size: 16px; font-weight: 600; color: #000; font-variant-numeric: tabular-nums">3</span>
              <div style="display: flex; background: rgba(118,118,128,0.12); border-radius: 9px; overflow: hidden">

                <div style="width: 1px; background: rgba(60,60,67,0.2)"></div>

    </div>

    <div style="padding: 18px 20px 0 20px">
      <div style="height: 50px; border-radius: 25px; background: {{accent}}; display: flex; align-items: center; justify-content: center">
        <span class="cta">Fine</span>
      </div>
    </div>

  </div>
</div>
</x-dc>
<script data-dc-script data-props='{"flavor":{"editor":"color","default":"#0F3D6E","options":["#0F3D6E","#C2386F","#E8751A","#2FA88A"],"section":"Pagina"},"paper":{"editor":"enum","options":["Liscia","Puntinata","Millimetrata"],"default":"Puntinata","section":"Pagina"},"$preview":{"width":402,"height":874}}'>
class Component extends DCLogic {
  // The page's colours the way Flavor derives them: a faint tint of Main for
  // the ground, a deeper one for cards. Same formulas as Flavor.ground /
  // Flavor.surface, so a Flavor tweak restains the whole preview.
  hsb(hex) {
    const n = parseInt(String(hex).replace('#', ''), 16);
    const r = ((n >> 16) & 255) / 255, g = ((n >> 8) & 255) / 255, b = (n & 255) / 255;
    const max = Math.max(r, g, b), min = Math.min(r, g, b), d = max - min;
    let h = 0;
    if (d) {
      if (max === r) h = ((g - b) / d + (g < b ? 6 : 0)) / 6;
      else if (max === g) h = ((b - r) / d + 2) / 6;
      else h = ((r - g) / d + 4) / 6;
    }
    return [h, max ? d / max : 0, max];
  }
  hex(h, s, v) {
    const f = (n) => {
      const k = (n + h * 6) % 6;
      return Math.round(255 * (v - v * s * Math.max(0, Math.min(k, 4 - k, 1))));
    };
    return '#' + [f(5), f(3), f(1)].map((c) => c.toString(16).padStart(2, '0')).join('').toUpperCase();
  }
  page() {
    const main = this.props.flavor ?? '#0F3D6E';
    const [h, s] = this.hsb(main);
    const ground = this.hex(h, Math.min(s * 0.06, 0.06), 0.98);
    const card = this.hex(h, Math.min(s * 0.11, 0.1), 0.945);
    const surface = this.hex(h, Math.min(s * 0.16, 0.14), 0.9);
    const line = this.hex(h, Math.min(s * 0.2, 0.18), 0.82);
    const paper = this.props.paper ?? 'Puntinata';
    const dot = this.hex(h, Math.min(s * 0.3, 0.3), 0.78);
    const papers = {
      Liscia: { image: 'none', size: 'auto' },
      Puntinata: { image: 'radial-gradient(' + dot + ' 1.1px, transparent 1.2px)', size: '12px 12px' },
      Millimetrata: {
        image: 'linear-gradient(' + dot + ' 0.6px, transparent 0.6px), linear-gradient(90deg, ' + dot + ' 0.6px, transparent 0.6px)',
        size: '9px 9px',
      },
    };
    const chosen = papers[paper] ?? papers.Puntinata;
    return { accent: main, ground, card, surface, line, paperImage: chosen.image, paperSize: chosen.size };
  }
  renderVals() {
    return this.page();
  }
}
</script>
